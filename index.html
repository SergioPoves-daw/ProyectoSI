<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Inicio de Sesión</title>
</head>
<body>
    <header>
        <h1>AGRADECE EN COMPAÑÍA</h1>
        <h2>Comparte gratitud y fortalece la comunidad</h2>
    </header>
    <main>
        <form method="GET" action="" id="formSesion">
            <div>
                <h3>Inicia sesión para continuar</h3>
            </div>
            <div>
                <p>
                    <label>Correo electrónico</label>
                    <br>
                    <input type="email" placeholder="correo@email.com" name="correo" class="info">
                </p>

                <p>
                    <label>Contraseña</label>
                    <br>
                    <input type="password" placeholder="Tu contraseña" name="contraseña" class="info">
                </p>
                
                <p id="infoContraseña">
                    <input type="checkbox" name="recordar" id="recordar">
                    <label for="recordar">Recordarme</label>
                    <a href="">¿Olvidaste tu contraseña?</a>
                </p>

                <p>
                    <input type="submit" value="Enviar" id="submit" class="info">
                </p>
            </div>
        </form>
    </main>
    <footer>
        <img src="./img/iconoJesuitas.png" id="iconoJesuita">
    </footer>
</body>
</html>
