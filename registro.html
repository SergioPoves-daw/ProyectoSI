<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Registro</title>
</head>
<body>
    <header>
        <img id="logo" src="./img/logoJesuitas.png">
        <h1>AGRADECE EN COMPAÑÍA</h1>
        <h2>Comparte gratitud y fortalece la comunidad</h2>
    </header>

    <main>
        <form method="POST" action="" id="formSesion">
            <div>
                <h3>Crea una cuenta para acceder a la aplicación</h3>
            </div>
            <div>
                <p>
                    <label>Nombre de usuario</label>
                    <br>
                    <input type="text" placeholder="Tu nombre" name="nombre" class="info">
                </p>

                <p>
                    <label>Contraseña</label>
                    <br>
                    <input type="password" placeholder="Tu contraseña" name="password" class="info">
                </p>

                <p>
                    <input type="submit" value="Enviar" id="submit" class="info">
                </p>
            </div>
        </form>
    </main>
    
    <footer>
        <img src="./img/iconoJesuitas.png" id="iconoJesuita">
    </footer>
</body>
</html>
